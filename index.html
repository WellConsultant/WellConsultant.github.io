<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ほじょきんTools｜会員入口</title>
  <meta name="robots" content="noindex">
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f5f6;color:#202a33;line-height:1.8}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:32px}
    .card{width:min(620px,100%);background:#fff;border:1px solid #d7dde2;border-radius:12px;padding:36px;box-shadow:0 18px 45px rgba(20,31,43,.08)}
    .eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;color:#56616b;margin:0 0 10px}
    h1{font-size:30px;line-height:1.35;margin:0 0 14px;letter-spacing:-.02em}
    p{margin:0 0 22px;color:#54616d}
    .actions{display:grid;gap:12px;margin-top:26px}
    a{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:8px;text-decoration:none;font-weight:800;border:1px solid #2f3a44;color:#fff;background:#2f3a44}
    a.secondary{background:#fff;color:#2f3a44}
    .note{font-size:13px;margin-top:18px;color:#6a7580}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <p class="eyebrow">JIZOKUKA SUBSIDY</p>
      <h1>ほじょきんTools（持続化補助金）</h1>
      <p>会員専用ページの入口です。パスワードを入力して、申請前から実績報告までの資料を確認してください。</p>
      <div class="actions">
        <a href="/member/">会員ページに入る</a>
        <a class="secondary" href="https://www.chatwork.com/g/hojokin-tools-jizokuka">Chatworkの案内を確認する</a>
      </div>
      <p class="note">HTML資料は会員ページ内で開きます。保存用ファイルのみダウンロード対象です。</p>
    </section>
  </main>
</body>
</html>
